<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>混沌纪元 · 身份验证</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#0a0208; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }

  /* ===== 背景图：缓慢漂移产生动感 ===== */
  .bg {
    position:fixed; inset:-4%;
    background:url('bg.png') center/cover no-repeat;
    animation: drift 40s ease-in-out infinite alternate;
    z-index:0;
  }
  @keyframes drift {
    0%   { transform:scale(1)    translate(0,0); }
    50%  { transform:scale(1.08) translate(1.2%,-1%); }
    100% { transform:scale(1.04) translate(-1.2%,1%); }
  }
  .bg::after { /* 轻微暗角，突出文字 */
    content:""; position:absolute; inset:0;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }

  /* ===== 顶部横幅 ===== */
  .header {
    position:fixed; top:0; left:0; right:0; z-index:2;
    height:clamp(64px, 12vw, 110px);
    background:linear-gradient(90deg,#000 0%, #3a0008 35%, #c40f1e 62%, #e63946 78%, #000 100%);
    clip-path:ellipse(85% 130% at 50% -30%);
    display:flex; align-items:center; justify-content:center; gap:2vw;
  }
  .header img { height:clamp(34px,7vw,60px); filter:drop-shadow(0 2px 6px rgba(0,0,0,.6)); }

  /* ===== 中央验证区 ===== */
  .center {
    position:fixed; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:0 8vw;
  }
  .title {
    color:#fff; font-weight:900; letter-spacing:.35em; text-indent:.35em;
    font-size:clamp(22px, 5.5vw, 44px);
    text-shadow:0 0 18px rgba(255,60,60,.8), 0 2px 8px #000;
    margin-bottom:4vh;
  }
  .input-wrap {
    width:min(520px, 86vw);
    background:rgba(255,255,255,.92);
    border:3px solid #d9d9d9;
    border-radius:999px;
    padding:clamp(10px,2.2vw,16px) clamp(18px,4vw,28px);
    box-shadow:0 0 25px rgba(0,0,0,.5), inset 0 0 10px rgba(0,0,0,.08);
  }
  .input-wrap input {
    width:100%; border:none; outline:none; background:transparent;
    font-size:clamp(16px,3.6vw,22px); text-align:center;
    letter-spacing:.2em; color:#222;
  }
  .btn {
    margin-top:3.5vh;
    width:min(520px, 86vw);
    padding:clamp(10px,2.4vw,16px) 0;
    border:none; border-radius:999px; cursor:pointer;
    font-size:clamp(16px,3.8vw,22px); font-weight:bold; letter-spacing:.4em; text-indent:.4em;
    color:#fff;
    background:linear-gradient(180deg,#e63946,#8b0f1a);
    border:2px solid rgba(255,255,255,.35);
    box-shadow:0 4px 18px rgba(200,20,40,.6);
    transition:transform .15s, filter .15s;
  }
  .btn:active { transform:scale(.97); filter:brightness(1.2); }
  .btn:disabled { filter:grayscale(.6) brightness(.7); cursor:not-allowed; }
  .err { color:#ff9a9a; font-size:clamp(12px,3vw,15px); margin-top:2vh; min-height:1.4em; text-shadow:0 1px 4px #000; }

  /* ===== 公告 ===== */
  .notice {
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:4vh; z-index:2;
    width:min(760px, 88vw);
    color:#eee; font-size:clamp(12px,3vw,16px); line-height:1.9;
    text-align:center; text-shadow:0 1px 6px #000;
    background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px; padding:12px 16px;
    backdrop-filter:blur(2px);
    max-height:24vh; overflow-y:auto;
  }

  /* ===== 大厅页（验证成功后显示） ===== */
  .hall { display:none; position:fixed; inset:0; z-index:5; background:#0d0d12; color:#eee; overflow-y:auto; }
  .hall .top { background:linear-gradient(90deg,#000,#a01220); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; }
  .hall .top img { height:30px; }
  .hall .body { max-width:900px; margin:0 auto; padding:20px; }
  .card { background:#1a1a22; border:1px solid #2c2c38; border-radius:12px; padding:18px; margin-bottom:16px; }
  .card h3 { color:#ff5566; margin-bottom:10px; border-left:4px solid #ff5566; padding-left:10px; }
  .dice { font-size:40px; cursor:pointer; user-select:none; }
  .dice-result { font-size:22px; color:#ffd166; margin-top:8px; min-height:1.2em; }
  .stat { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #333; }
</style>
</head>
<body>

<!-- ============ 启动 / 验证页 ============ -->
<div class="bg"></div>

<div class="header">
  <img src="logo.png" alt="混沌纪元">
</div>

<div class="center">
  <div class="title">· 验证身份 ·</div>
  <div class="input-wrap">
    <input id="playerId" type="text" inputmode="numeric" maxlength="10" placeholder="请输入玩家ID" autocomplete="off">
  </div>
  <button class="btn" id="enterBtn" onclick="verify()">进 入</button>
  <div class="err" id="err"></div>
</div>

<div class="notice" id="notice"></div>

<!-- ============ 大厅页 ============ -->
<div class="hall" id="hall">
  <div class="top">
    <img src="logo.png" alt="混沌纪元">
    <span id="hello" style="font-size:14px;"></span>
  </div>
  <div class="body">
    <div class="card">
      <h3>我的角色</h3>
      <div class="stat"><span>姓名</span><span>——（后台接入后显示）</span></div>
      <div class="stat"><span>金币</span><span id="gold">100</span></div>
      <div class="stat"><span>生命</span><span>10 / 10</span></div>
      <div class="stat"><span>所在地点</span><span>新手村</span></div>
    </div>
    <div class="card">
      <h3>道具商店（示例）</h3>
      <div class="stat"><span>治疗药水（10金）</span><button class="btn" style="width:auto;margin:0;padding:6px 18px;" onclick="buy('治疗药水',10)">购买</button></div>
      <div class="stat"><span>火把（5金）</span><button class="btn" style="width:auto;margin:0;padding:6px 18px;" onclick="buy('火把',5)">购买</button></div>
    </div>
    <div class="card">
      <h3>骰子 🎲（点击摇骰）</h3>
      <div class="dice" onclick="roll()">🎲</div>
      <div class="dice-result" id="diceResult"></div>
    </div>
    <div class="card">
      <h3>公告</h3>
      <div id="hallNotice" style="line-height:1.9;"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ★★★ 站长配置区：以后你只需要改这里 ★★★
============================================================ */
const CONFIG = {
  // 后台设置的、允许进入的玩家ID（以后接真后台就换成接口）
  validIds: ["00001"],

  // 首页公告（想改就改这里的文字）
  notice: "欢迎来到《混沌纪元》跑团世界！\n这是一个测试内容，此处为站长后台可编辑的公告栏。\n请输入你的玩家ID进入大厅，祝冒险愉快！",

  // 玩家资料（目前是演示数据，接后台后由数据库返回）
  players: {
    "00001": { name: "测试冒险者", gold: 100, hp: "10 / 10", place: "新手村" }
  }
};
/* ============================================================ */

document.getElementById("notice").innerText = CONFIG.notice;
document.getElementById("hallNotice").innerText = CONFIG.notice;

function verify() {
  const id = document.getElementById("playerId").value.trim();
  const err = document.getElementById("err");
  if (!id) { err.innerText = "请输入玩家ID"; return; }
  if (CONFIG.validIds.includes(id)) {
    const p = CONFIG.players[id] || { name:"冒险者", gold:0, hp:"--", place:"--" };
    document.getElementById("hello").innerText = "ID: " + id + " · " + p.name;
    document.getElementById("gold").innerText = p.gold;
    document.getElementById("hall").style.display = "block";
  } else {
    err.innerText = "ID不存在或未激活，请联系主持人";
  }
}
document.getElementById("playerId").addEventListener("keydown", e => { if (e.key === "Enter") verify(); });

let gold = 100;
function buy(item, price) {
  if (gold >= price) { gold -= price; document.getElementById("gold").innerText = gold; alert("购买成功：" + item + "，剩余金币 " + gold); }
  else alert("金币不足！");
}
function roll() {
  document.getElementById("diceResult").innerText = "掷出了 " + (Math.floor(Math.random() * 20) + 1) + " 点（D20）";
}
</script>
</body>
</html>
