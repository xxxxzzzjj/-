<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>皮蛋 · 卡密管理</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">P</span><div><strong>皮蛋设计</strong><span>卡密管理中心</span></div></div>
    <div class="top-actions"><span id="connection" class="connection">未连接</span><button id="settings-open" class="secondary">连接设置</button></div>
  </header>
  <main>
    <div class="page-heading"><div><div class="eyebrow">LICENSE MANAGEMENT</div><h1>卡密管理</h1><p>签发、查询和管理客户授权</p></div><button id="refresh" class="secondary">↻　刷新记录</button></div>
    <section class="workspace">
      <aside class="issue-area">
        <div class="section-title"><div><h2>签发卡密</h2><p>创建新的客户授权</p></div><span class="section-number">01</span></div>
        <form id="issue-form">
          <label>客户名称或备注<input id="issue-note" maxlength="200" placeholder="例如：客户名称"></label>
          <label>授权方式<select id="issue-scope"><option value="unbound">首次兑换绑定</option><option value="fixed">指定机器码</option><option value="multi">多设备共享</option></select></label>
          <label id="machine-label" hidden>客户机器码<textarea id="issue-machine" rows="2" placeholder="粘贴客户机器码"></textarea></label>
          <div class="field-pair"><label>有效天数<input id="days" type="number" min="1" max="36500" value="30"></label><label class="check-label"><input id="permanent" type="checkbox"><span>永久授权</span></label></div>
          <label id="issue-binds-label">允许解绑次数<input id="issue-max-binds" type="number" min="0" max="99" step="1" value="1" required></label>
          <label id="issue-devices-label" hidden>最多绑定电脑数<input id="issue-max-devices" type="number" min="1" max="99" step="1" value="2"></label>
          <label>生效时间<input id="starts" type="datetime-local"></label>
          <label>到期时间<input id="expires" type="datetime-local"></label>
          <button type="submit" class="primary full">签发卡密</button>
        </form>
        <div class="result"><div class="result-heading"><span>签发结果</span><button id="copy-new" class="text-button" disabled>复制卡密</button></div><textarea id="issued-key" rows="4" readonly placeholder="签发成功后显示卡密"></textarea></div>
      </aside>
      <section class="records-area">
        <div class="section-title"><div><h2>云端记录</h2><p id="record-count">连接后查看卡密记录</p></div><span class="section-number">02</span></div>
        <div class="toolbar"><input id="filter" type="search" placeholder="搜索名称、卡密 ID 或机器码"><select id="state-filter" aria-label="筛选状态"><option value="all">全部状态</option><option value="active">正常</option><option value="expired">已到期</option><option value="revoked">已停用</option></select><button id="import" class="secondary">导入旧记录</button><button id="export" class="secondary">导出记录</button><input id="import-file" type="file" accept=".json,application/json" hidden></div>
        <div class="table-wrap"><table><thead><tr><th>名称 / 卡密 ID</th><th>绑定状态</th><th>换绑</th><th>到期时间</th><th>状态</th></tr></thead><tbody id="records"><tr><td colspan="5" class="empty">请输入连接信息并刷新记录</td></tr></tbody></table></div>
        <div class="detail" id="detail"><div class="detail-head"><div><h3>卡密详情</h3><p id="selected-label">选择一条记录进行管理</p></div><span id="selected-state"></span></div><div id="details-content" hidden><dl><div><dt>卡密 ID</dt><dd id="detail-id"></dd></div><div><dt>绑定机器码</dt><dd id="detail-machine"></dd></div><div><dt>签名到期</dt><dd id="detail-signed-expiry"></dd></div></dl><div id="device-settings" class="bind-settings" hidden><label>最多绑定电脑数<input id="detail-max-devices" type="number" min="1" max="99" step="1"></label><button data-action="devices" class="secondary">保存台数</button><span id="device-count"></span></div><div id="device-list"></div><div class="bind-settings"><label>允许解绑次数<input id="detail-max-binds" type="number" min="0" max="99" step="1"></label><button data-action="binds" class="secondary">保存次数</button><span id="detail-binds-used"></span><button data-action="reset" class="secondary">重置已用次数</button></div><div class="detail-actions"><button data-action="copy" class="secondary">复制卡密</button><button data-action="note" class="secondary">修改备注</button><button data-action="rebind" class="secondary">解绑</button><button data-action="expiry" class="secondary">修改期限</button><button data-action="toggle" class="secondary">停用 / 恢复</button><button data-action="logs" class="secondary">查看记录</button><button data-action="delete" class="secondary danger">删除卡密</button></div><div id="logs" hidden></div></div></div>
      </section>
    </section>
    <section class="notice-editor" aria-labelledby="notice-title">
      <div class="section-title"><div><h2 id="notice-title">插件公告</h2><p>公告同步到插件公告窗口，可设置颜色、字号、粗体和换行</p></div><span class="section-number">03</span></div>
      <label>公告文字<textarea id="notice-text" rows="5" maxlength="4000" placeholder="输入要显示在插件公告窗口中的内容"></textarea></label>
      <div class="notice-options">
        <label>文字颜色<input id="notice-color" type="color" value="#FF5555"></label>
        <label>字号<input id="notice-size" type="number" min="10" max="28" step="1" value="12"></label>
        <label class="check-label"><input id="notice-bold" type="checkbox"><span>加粗</span></label>
        <button id="notice-load" class="secondary">读取公告</button>
        <button id="notice-save" class="primary">保存公告</button>
      </div>
      <div class="notice-preview-wrap"><span>预览</span><div id="notice-preview" class="notice-preview">公告预览</div></div>
    </section>
    <div id="status" class="status" role="status">准备就绪</div>
  </main>
  <dialog id="settings"><form method="dialog" class="dialog-form"><div class="dialog-heading"><h2>连接设置</h2><button class="icon-button" aria-label="关闭" value="cancel">×</button></div><label>云函数地址<input id="endpoint" type="url" autocomplete="off"></label><label>管理令牌<input id="admin-token" type="password" autocomplete="off"></label><label>发卡口令<input id="signing-token" type="password" autocomplete="off"></label><p>令牌仅保存在当前页面内，关闭页面后需要重新输入。</p><div class="dialog-buttons"><button class="secondary" value="cancel">取消</button><button id="settings-save" class="primary" value="default">确认</button></div></form></dialog>
</body>
</html>
